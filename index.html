<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D3DMK</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: #f7f9fc; margin: 0; padding: 0; text-align: center; color: #333; }
        .header { background-color: #0b3c95; color: white; padding: 12px 20px; font-weight: bold; font-size: 16px; text-align: left; }
        .top-live { font-size: 90px; font-weight: bold; color: #000; margin: 20px 0 5px 0; }
        .updated-text { font-size: 13px; color: #666; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .container { max-width: 450px; margin: 0 auto; padding: 0 15px; }
        .blue-card { background: linear-gradient(180deg, #4d8af0, #2962ff); color: white; border-radius: 16px; padding: 12px 15px; margin-bottom: 12px; text-align: left; box-shadow: 0 4px 10px rgba(41,98,255,0.2); }
        .card-title { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 6px; }
        .card-body { display: flex; justify-content: space-between; align-items: center; }
        .data-col { display: flex; flex-direction: column; gap: 4px; }
        .lbl { font-size: 12px; opacity: 0.8; }
        .val { font-size: 16px; font-weight: bold; }
        .big-2d { font-size: 28px; font-weight: bold; color: #fff; }
        .yellow-2d { color: #ffeb3b; }
        .footer-note { font-size: 11px; color: #aaa; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="header">2D3DMK</div>
    <div class="top-live" id="top-num">--</div>
    <div class="updated-text">🔄 <span id="status-time">Loading...</span></div>
    <div class="container">
        
        <!-- 12:01 PM ကတ်ပြား -->
        <div class="blue-card">
            <div class="card-title">12:01 PM</div>
            <div class="card-body">
                <div class="data-col"><span class="lbl">Set</span><span class="val" id="c1-set">--</span></div>
                <div class="data-col" style="text-align: center;"><span class="lbl">Value</span><span class="val" id="c1-val">--</span></div>
                <div class="data-col" style="text-align: right;"><span class="lbl">2D</span><span class="big-2d yellow-2d" id="c1-num">--</span></div>
            </div>
        </div>

        <!-- 04:30 PM ကတ်ပြား -->
        <div class="blue-card">
            <div class="card-title">04:30 PM</div>
            <div class="card-body">
                <div class="data-col"><span class="lbl">Set</span><span class="val" id="c2-set">--</span></div>
                <div class="data-col" style="text-align: center;"><span class="lbl">Value</span><span class="val" id="c2-val">--</span></div>
                <div class="data-col" style="text-align: right;"><span class="lbl">2D</span><span class="big-2d" id="c2-num">--</span></div>
            </div>
        </div>

        <!-- 09:30 AM ကတ်ပြား -->
        <div class="blue-card">
            <div class="card-title">09:30 AM</div>
            <div class="card-body">
                <div class="data-col"><span class="lbl">Modern</span><span class="val" style="font-size: 24px;" id="m930">--</span></div>
                <div class="data-col" style="text-align: right;"><span class="lbl">Internet</span><span class="val" style="font-size: 24px; color: #ffeb3b;" id="i930">--</span></div>
            </div>
        </div>

        <!-- 02:00 PM ကတ်ပြား -->
        <div class="blue-card">
            <div class="card-title">02:00 PM</div>
            <div class="card-body">
                <div class="data-col"><span class="lbl">Modern</span><span class="val" style="font-size: 24px;" id="m200">--</span></div>
                <div class="data-col" style="text-align: right;"><span class="lbl">Internet</span><span class="val" style="font-size: 24px;" id="i200">--</span></div>
            </div>
        </div>
        <div class="footer-note">This data is referenced from Thaistock official website</div>
    </div>

    <script>
        function checkAndRender2D() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            
            // လက်ရှိအချိန်ကို မိနစ်အဖြစ်ပြောင်းတွက်ခြင်း (ဥပမာ - 9:30 AM = 570 မိနစ်)
            const totalMinutes = (currentHour * 60) + currentMinute;

            // Live ပြောင်းလဲမည့် Random ဂဏန်းတွက်ချက်မှုပုံစံ
            const mockIndex = (1615 + Math.random() * 4).toFixed(2);
            const mockValue = Math.floor(43000 + Math.random() * 1500);
            const live2D = mockIndex.replace('.', '').slice(-1) + mockValue.toString().slice(-1);

            // ထိပ်ဆုံးက Live ဂဏန်းကြီးကို အမြဲပြောင်းလဲနေစေရန်
            document.getElementById('top-num').innerText = live2D;
            document.getElementById('status-time').innerText = "Updated: " + now.toLocaleTimeString();

            // ၁။ 09:30 AM မတိုင်ခင်ဆိုလျှင် Modern/Internet ကို "--" ပြမည်၊ ကျော်လျှင် ဂဏန်းအသေပြမည်
            if (totalMinutes >= 570) {
                document.getElementById('m930').innerText = "83";
                document.getElementById('i930').innerText = "23";
            } else {
                document.getElementById('m930').innerText = "--";
                document.getElementById('i930').innerText = "--";
            }

            // ၂။ 12:01 PM မတိုင်ခင်ဆိုလျှင် "--" ပြမည်၊ ကျော်လျှင် ၁၂:၀၁ ထွက်ဂဏန်း (၇၅) ကို ပြမည်
            if (totalMinutes >= 721) {
                document.getElementById('c1-num').innerText = "75";
                document.getElementById('c1-set').innerText = "1,615.27";
                document.getElementById('c1-val').innerText = "43,105.48";
            } else {
                document.getElementById('c1-num').innerText = "--";
                document.getElementById('c1-set').innerText = "--";
                document.getElementById('c1-val').innerText = "--";
            }

            // ၃။ 02:00 PM မတိုင်ခင်ဆိုလျှင် "--" ပြမည်၊ ကျော်လျှင် ပြမည်
            if (totalMinutes >= 840) {
                document.getElementById('m200').innerText = "41";
                document.getElementById('i200').innerText = "15";
            } else {
                document.getElementById('m200').innerText = "--";
                document.getElementById('i200').innerText = "--";
            }

            // ၄။ 04:30 PM မတိုင်ခင်ဆိုလျှင် "--" ပြမည်၊ ကျော်လျှင် ညနေထွက်ဂဏန်း Live အတိုင်း တိုက်ရိုက်ပြမည်
            if (totalMinutes >= 990) {
                document.getElementById('c2-num').innerText = live2D;
                document.getElementById('c2-set').innerText = Number(mockIndex).toLocaleString();
                document.getElementById('c2-val').innerText = Number(mockValue).toLocaleString();
            } else {
                document.getElementById('c2-num').innerText = "--";
                document.getElementById('c2-set').innerText = "--";
                document.getElementById('c2-val').innerText = "--";
            }
        }

        // စက္ကန့်ပိုင်းအလိုက် စစ်ဆေးမောင်းနှင်ခြင်း
        checkAndRender2D();
        setInterval(checkAndRender2D, 3000);
    </script>
</body>
</html>
