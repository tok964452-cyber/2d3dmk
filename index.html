    <script>
        function runPerfectDashboard() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const totalMinutes = (currentHour * 60) + currentMinute;

            // Live စက္ကန့်ပိုင်းအလိုက် လှုပ်ရှားမည့် စတော့ကိန်းဂဏန်းများ (အပေါ်ဆုံး Live နံပါတ်အတွက်သာ)
            const mockIndex = (1615 + Math.random() * 4).toFixed(2);
            const mockValue = Math.floor(43000 + Math.random() * 1500);
            const live2D = mockIndex.replace('.', '').slice(-1) + mockValue.toString().slice(-1);

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const timeStr = now.toTimeString().split(' ')[0]; // Time format သေချာအောင် ပြင်ဆင်ထားသည်
            const fullDateStr = `${year}-${month}-${day} ${timeStr}`;

            // 09:30 AM နှင့် 02:00 PM စစ်ဆေးချက်များ
            if (totalMinutes >= 570) {
                document.getElementById('m930').innerText = "83";
                document.getElementById('i930').innerText = "23";
            } else {
                document.getElementById('m930').innerText = "--";
                document.getElementById('i930').innerText = "--";
            }

            if (totalMinutes >= 840) {
                document.getElementById('m200').innerText = "41";
                document.getElementById('i200').innerText = "15";
            } else {
                document.getElementById('m200').innerText = "--";
                document.getElementById('i200').innerText = "--";
            }

            // ၁။ မနက်ခင်းဈေးကွက်ပိတ်ချိန် (12:01 PM မှ 02:30 PM အတွင်း)
            if (totalMinutes >= 721 && totalMinutes < 870) {
                document.getElementById('top-num').innerText = "75"; 
                document.getElementById('live-icon').innerHTML = "↻"; 
                document.getElementById('status-time').innerText = `${year}-${month}-${day} 12:01:00`; 
                
                document.getElementById('t1-icon').innerHTML = "×"; 
                document.getElementById('c1-num').innerText = "75";
                document.getElementById('c1-set').innerText = "1,615.27";
                document.getElementById('c1-val').innerText = "43,105.48";
                
                document.getElementById('t2-icon').innerText = "🔄";
                document.getElementById('c2-num').innerText = "--";
                document.getElementById('c2-set').innerText = "--";
                document.getElementById('c2-val').innerText = "--";
            }
            // ၂။ ညနေခင်းဈေးကွက်အပြီးတိုင်ပိတ်ချိန် (04:30 PM ကျော်လွန်သွားချိန်)
            else if (totalMinutes >= 990) {
                document.getElementById('top-num').innerText = "85"; 
                document.getElementById('live-icon').innerHTML = "↻"; 
                document.getElementById('status-time').innerText = `${year}-${month}-${day} 16:30:00`; 
                
                document.getElementById('t1-icon').innerHTML = "×";
                document.getElementById('c1-num').innerText = "75";
                document.getElementById('c1-set').innerText = "1,615.27";
                document.getElementById('c1-val').innerText = "43,105.48";
                
                document.getElementById('t2-icon').innerHTML = "×";
                document.getElementById('c2-num').innerText = "85";
                document.getElementById('c2-set').innerText = "1,618.42";
                document.getElementById('c2-val').innerText = "44,210.85";
            }
            // ၃။ ပုံမှန်ဈေးကွက်ဖွင့်လှစ်ချိန် (ဂဏန်းများ ငြိမ်နေစေရန် တည်ငြိမ်သော Mock Data ထားရှိသည်)
            else {
                document.getElementById('top-num').innerText = live2D; 
                document.getElementById('live-icon').innerText = "🔄"; 
                document.getElementById('status-time').innerText = fullDateStr;
                
                document.getElementById('t1-icon').innerText = "🔄";
                document.getElementById('c1-num').innerText = "--";
                document.getElementById('c1-set').innerText = "1,612.45"; // ဈေးကွက်ဖွင့်ချိန်တွင် ကတ်ထဲ၌ ငြိမ်နေမည့်ဂဏန်း
                document.getElementById('c1-val').innerText = "38,500";
                
                document.getElementById('t2-icon').innerText = "🔄";
                document.getElementById('c2-num').innerText = "--";
                document.getElementById('c2-set').innerText = "1,614.20"; // ဈေးကွက်ဖွင့်ချိန်တွင် ကတ်ထဲ၌ ငြိမ်နေမည့်ဂဏန်း
                document.getElementById('c2-val').innerText = "41,200";
            }
        }

        // Dashboard ကို ပထမဆုံးတစ်ကြိမ် ချက်ချင်း Run မည်
        runPerfectDashboard();
        
        // အပေါ်ဆုံး Live ဂဏန်းနှင့် အချိန်ပြောင်းလဲနှုန်းကို 5000ms (၅ စက္ကန့်) သို့ ပြောင်းလဲသတ်မှတ်လိုက်သည်
        setInterval(runPerfectDashboard, 5000);
    </script>
